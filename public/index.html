<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>mc-headless</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
:root{
  --bg:#0b0d10; --ink:#f2f4f7; --mute:#9aa3ae; --faint:#6b7480;
  --line:rgba(255,255,255,.09); --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --ok:#5be08a; --warn:#f5b84b; --bad:#ff6b6b; --acc:#8ab4ff;
  --r:18px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:15px/1.45 var(--font);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 12% -8%,rgba(70,110,200,.28),transparent 60%),
             radial-gradient(800px 520px at 100% 0,rgba(60,170,140,.16),transparent 55%),var(--bg);
  background-attachment:fixed}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 12px 40px rgba(0,0,0,.28)}
.shell{max-width:1080px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 110px}
header{display:flex;align-items:center;gap:12px;margin-bottom:26px}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
header small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:1px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:13px;background:var(--glass);border:1px solid var(--line)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.warn i{background:var(--warn)}
.pill.bad i{background:var(--bad)}
nav.side{display:flex;gap:4px;margin-bottom:22px}
nav.side button{background:none;border:0;padding:8px 14px;border-radius:10px;color:var(--mute);cursor:pointer;font-weight:500}
nav.side button.on{background:var(--glass2);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{padding:20px;min-width:0}
.grid>*{min-width:0}
.shell{overflow-x:hidden}
#chat-form input{flex:1;min-width:0;width:auto}
.card.wide{grid-column:1/-1}
h2{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.sub{color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field.grow{flex:1;min-width:140px}
label{font-size:11px;color:var(--faint);letter-spacing:.06em;font-weight:600}
input[type=text],input[type=number],input[type=password]{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s}
input:focus{border-color:rgba(138,180,255,.6)}
.btn{background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:500;transition:background .15s,transform .05s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:#0b0d10;border-color:transparent}
.btn.primary:hover{background:#fff}
.btn.danger{color:var(--bad)}
.recent{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.recent button{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--mute);cursor:pointer;font-family:var(--mono)}
.recent button:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}
.session{border-color:rgba(245,184,75,.35)}
.session.bad{border-color:rgba(255,107,107,.4)}
.code{font:600 34px/1 var(--mono);letter-spacing:.14em;margin:14px 0 8px}
.steps{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
a{color:var(--acc);text-decoration:none;word-break:break-all}
.scripts{display:flex;flex-direction:column}
.script{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.script:first-of-type{border-top:0;padding-top:0}
.script .t{flex:1}
.script b{font-weight:600;display:block}
.script span{color:var(--mute);font-size:13.5px}
.tog{position:relative;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.14);border:0;cursor:pointer;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--ok)}
.tog.on::after{transform:translateX(18px)}
.tog:disabled{opacity:.4}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:8px;justify-content:start}
.pad .btn{padding:0;height:52px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.m{background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px}
.m span{display:block;font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.m b{font:500 16px var(--mono);overflow-wrap:anywhere}
.inv{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.inv div{background:rgba(0,0,0,.22);border-radius:8px;padding:4px 9px;font-size:13px}
.inv b{margin-left:6px;color:var(--mute);font-weight:500}
.seg{display:inline-flex;background:rgba(0,0,0,.25);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{background:none;border:0;padding:6px 14px;border-radius:8px;color:var(--mute);cursor:pointer;font-size:13px}
.seg button.on{background:var(--glass2);color:var(--ink)}
pre.logs{font:12px/1.5 var(--mono);background:rgba(0,0,0,.35);border-radius:12px;padding:14px;max-height:56vh;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#cfd5dd}
.pane{display:none}.pane.cur{display:block}
.tabbar{display:none}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{width:100%;max-width:340px;padding:28px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate-card img{width:56px;height:56px;border-radius:14px;margin:0 auto}
.err{color:var(--bad);font-size:13px;min-height:16px}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#1c2026;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(91,224,138,.4)}
@media(max-width:720px){
  .grid{grid-template-columns:1fr}
  nav.side{display:none}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:6px;z-index:5}
  .tabbar button{flex:1;background:none;border:0;padding:10px 0;border-radius:12px;color:var(--mute);font-weight:500}
  .tabbar button.on{background:var(--glass2);color:var(--ink)}
  .code{font-size:26px;letter-spacing:.08em}
  .shell{padding-left:14px;padding-right:14px}
  .card{padding:16px}
  .m b{font-size:14px}
  .pad{grid-template-columns:repeat(3,minmax(0,64px))}
}
</style>
</head>
<body>
<div id="gate" hidden>
  <form class="glass gate-card" id="gate-form">
    <img src="/logo.svg" alt="">
    <div><b style="font-size:17px">mc-headless</b></div>
    <input type="password" id="gate-pw" placeholder="Password" autocomplete="current-password">
    <div class="err" id="gate-err"></div>
    <button class="btn primary" type="submit" id="gate-btn">Log in</button>
  </form>
</div>

<div class="shell" id="app" hidden>
  <header>
    <img src="/logo.svg" alt="">
    <h1>mc-headless<small id="sub">HeadlessMC</small></h1>
    <span class="sp"></span>
    <span id="status-pill" class="pill"><i></i><span>connecting</span></span>
  </header>
  <nav class="side" id="sidenav">
    <button data-pane="home" class="on">Home</button><button data-pane="control">Control</button><button data-pane="logs">Logs</button>
  </nav>

  <div class="pane cur" id="pane-home">
    <div class="card glass session wide" id="session-card" style="margin-bottom:16px" hidden>
      <h2 id="session-h">Session</h2>
      <p class="sub" id="session-p"></p>
      <div id="code-box" hidden>
        <div class="code" id="login-code">--------</div>
        <div class="sub">Open <a id="login-link" href="#" target="_blank" rel="noopener"></a> and enter the code with the Microsoft account the bot uses.</div>
      </div>
      <div class="steps">
        <button class="btn primary" id="relogin-btn">Sign in again</button>
        <button class="btn" id="copy-btn" hidden>Copy code</button>
        <button class="btn" id="relogin-cancel" hidden>Cancel</button>
      </div>
    </div>

    <div class="grid">
      <section class="card glass">
        <h2>Server</h2>
        <form id="connect-form" class="row">
          <div class="field grow"><label>HOST</label><input type="text" id="host" placeholder="play.example.com" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
          <div class="field" style="width:96px"><label>PORT</label><input type="number" id="port" value="25565" inputmode="numeric"></div>
          <button class="btn primary" type="submit">Join</button>
        </form>
        <div class="recent" id="recent"></div>
        <div style="margin-top:14px"><button class="btn danger" id="disconnect-btn">Disconnect</button></div>
      </section>

      <section class="card glass">
        <h2>AFK scripts</h2>
        <div class="scripts" id="scripts"><p class="sub">Loading</p></div>
      </section>
    </div>
  </div>

  <div class="pane" id="pane-control">
    <div class="grid">
      <section class="card glass">
        <h2>Chat</h2>
        <form id="chat-form" class="row" style="flex-wrap:nowrap;align-items:center">
          <input type="text" id="msg" placeholder="Message the server" maxlength="256" autocomplete="off">
          <button class="btn" type="submit">Send</button>
        </form>
        <h2 style="margin-top:22px">Move</h2>
        <div class="pad">
          <span></span><button class="btn" data-dir="forward">W</button><span></span>
          <button class="btn" data-dir="left">A</button><button class="btn" data-dir="back">S</button><button class="btn" data-dir="right">D</button>
          <button class="btn" data-dir="jump">Jump</button><button class="btn" data-dir="sneak">Sneak</button><button class="btn" data-dir="stop">Stop</button>
        </div>
        <div class="row" style="margin-top:16px">
          <div class="field grow"><label>YAW</label><input type="number" id="yaw" step="any" value="0"></div>
          <div class="field grow"><label>PITCH</label><input type="number" id="pitch" step="any" value="0"></div>
          <button class="btn" id="look-btn">Look</button>
        </div>
      </section>
      <section class="card glass">
        <h2>Player</h2>
        <p class="sub" id="telemetry-placeholder">No data yet. Join a world with the telemetry script running.</p>
        <div id="telemetry-data" hidden>
          <div class="metrics">
            <div class="m"><span>X</span><b id="t-x">-</b></div><div class="m"><span>Y</span><b id="t-y">-</b></div><div class="m"><span>Z</span><b id="t-z">-</b></div>
            <div class="m"><span>Yaw</span><b id="t-yaw">-</b></div><div class="m"><span>Pitch</span><b id="t-pitch">-</b></div><div class="m"><span>Health</span><b id="t-health">-</b></div>
          </div>
          <div class="inv" id="inv"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="pane" id="pane-logs">
    <section class="card glass">
      <div class="seg" id="logseg"><button data-log="game" class="on">Game</button><button data-log="entrypoint">Boot</button><button data-log="dashboard">Dashboard</button></div>
      <pre class="logs" id="logbox">Loading</pre>
    </section>
  </div>
</div>

<nav class="tabbar glass" id="tabbar" hidden>
  <button data-pane="home" class="on">Home</button><button data-pane="control">Control</button><button data-pane="logs">Logs</button>
</nav>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg, ok) { const t = $('toast'); t.textContent = msg; t.classList.toggle('ok', !!ok); t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800); }

// ---- auth gate ----
let authed = false, started = false, configured = true;
function showGate() { authed = false; $('gate').hidden = false; $('app').hidden = true; $('tabbar').hidden = true; setTimeout(() => $('gate-pw').focus(), 50); }
function hideGate() { authed = true; $('gate').hidden = true; $('app').hidden = false; $('tabbar').hidden = false; startApp(); }
$('gate-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('gate-btn'), err = $('gate-err'); err.textContent = ''; btn.disabled = true;
  try {
    const r = await fetch(configured ? '/api/login' : '/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('gate-pw').value }) });
    if (r.ok) { $('gate-pw').value = ''; if (!configured) { configured = true; $('gate-btn').textContent = 'Log in'; $('gate-pw').placeholder = 'Password'; $('gate-pw').autocomplete = 'current-password'; err.textContent = 'Password saved. Log in to continue.'; } else hideGate(); btn.disabled = false; return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = r.status === 429 ? 'Too many tries. Wait ' + Math.ceil((d.retry_after_sec || 900) / 60) + ' min.' : !configured ? (d.error || 'Could not save password') : 'Wrong password';
  } catch { err.textContent = 'Could not reach the server'; }
  btn.disabled = false; $('gate-pw').value = ''; $('gate-pw').focus();
});
async function apiFetch(url, opts) { const r = await fetch(url, opts); if (r.status === 401 && authed) showGate(); return r; }
async function post(url, body) {
  const r = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(r.status === 401 ? 'Log in first' : (d.error || d.message || 'HTTP ' + r.status));
  return d;
}

// ---- panes ----
function setPane(p) {
  document.querySelectorAll('.pane').forEach((x) => x.classList.toggle('cur', x.id === 'pane-' + p));
  document.querySelectorAll('[data-pane]').forEach((b) => b.classList.toggle('on', b.dataset.pane === p));
  try { localStorage.setItem('mch-pane', p); } catch {}
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('[data-pane]').forEach((b) => b.onclick = () => setPane(b.dataset.pane));
try { const p = localStorage.getItem('mch-pane'); if (p) setPane(p); } catch {}

// ---- last servers (localStorage) ----
const LS_RECENT = 'mch-servers';
function recent() { try { return JSON.parse(localStorage.getItem(LS_RECENT)) || []; } catch { return []; } }
function saveServer(host, port) {
  const key = host + ':' + port;
  const list = [key, ...recent().filter((x) => x !== key)].slice(0, 5);
  try { localStorage.setItem(LS_RECENT, JSON.stringify(list)); } catch {}
  drawRecent();
}
function drawRecent() {
  const list = recent();
  $('recent').innerHTML = list.map((k) => `<button type="button" data-k="${esc(k)}">${esc(k)}</button>`).join('');
  $('recent').querySelectorAll('button').forEach((b) => b.onclick = () => fillServer(b.dataset.k));
}
function fillServer(k) { const i = k.lastIndexOf(':'); $('host').value = k.slice(0, i); $('port').value = k.slice(i + 1); }
drawRecent();
if (recent()[0]) fillServer(recent()[0]);

// ---- status + session ----
let ses = null;
async function pollStatus() {
  let d; try { const r = await apiFetch('/api/status'); if (!r.ok) return; d = await r.json(); } catch { return; }
  const p = $('status-pill'), t = p.querySelector('span');
  if (ses && (ses.invalid || ses.relogin.state === 'waiting')) { t.textContent = 'Sign-in needed'; p.className = 'pill warn'; }
  else if (d.loginPending) { t.textContent = 'Sign-in needed'; p.className = 'pill warn'; }
  else if (d.running) { t.textContent = 'Running'; p.className = 'pill ok'; $('sub').textContent = 'HeadlessMC ' + (d.version || ''); }
  else { t.textContent = 'Stopped'; p.className = 'pill bad'; }
}
async function pollSession() {
  try { const r = await apiFetch('/api/session'); if (!r.ok) return; ses = await r.json(); } catch { return; }
  const st = ses.relogin.state, card = $('session-card');
  const need = ses.invalid || !ses.loginDone || st !== 'idle';
  card.hidden = !need;
  card.classList.toggle('bad', ses.invalid && st === 'idle');
  if (!need) return;
  const h = $('session-h'), p = $('session-p');
  $('code-box').hidden = !(st === 'waiting' && ses.code);
  $('copy-btn').hidden = $('code-box').hidden;
  $('relogin-cancel').hidden = st !== 'waiting';
  $('relogin-btn').hidden = st === 'waiting' || st === 'restarting';
  if (st === 'waiting') {
    h.textContent = 'Enter the code';
    p.textContent = ses.code ? 'This code is single use and expires in a few minutes.' : 'Requesting a code from Microsoft...';
    if (ses.code) { $('login-code').textContent = ses.code.code || '--------'; $('login-link').href = ses.code.fullUrl; $('login-link').textContent = ses.code.url; }
  } else if (st === 'restarting') {
    h.textContent = 'Signed in'; p.textContent = 'Restarting the game with the new session. This takes about two minutes.';
  } else if (st === 'failed') {
    h.textContent = 'Sign-in did not finish'; p.textContent = (ses.relogin.error || 'Try again.');
  } else if (st === 'done') {
    h.textContent = 'Signed in'; p.textContent = 'Client restarted. Join a server to continue.';
  } else {
    h.textContent = ses.invalid ? 'Session expired' : 'Not signed in';
    p.textContent = ses.invalid ? 'Minecraft rejected the saved session. Sign in again to get a fresh one.' : 'No Microsoft account is linked yet.';
  }
}
$('relogin-btn').onclick = async () => { const b = $('relogin-btn'); b.disabled = true; try { await post('/api/relogin'); await pollSession(); } catch (e) { toast(e.message); } b.disabled = false; };
$('relogin-cancel').onclick = async () => { try { await post('/api/relogin/cancel'); pollSession(); } catch (e) { toast(e.message); } };
$('copy-btn').onclick = () => { const c = $('login-code').textContent; if (navigator.clipboard) navigator.clipboard.writeText(c).then(() => toast('Copied', true)).catch(() => toast('Copy failed')); };

// ---- actions ----
function busy(id, fn, okMsg) { $(id).onclick = async () => { const b = $(id); b.disabled = true; try { await fn(); if (okMsg) toast(okMsg, true); } catch (e) { toast(e.message); } b.disabled = false; }; }
$('connect-form').onsubmit = async (e) => {
  e.preventDefault();
  const host = $('host').value.trim(), port = Number($('port').value) || 25565;
  if (!host) return toast('Enter a host');
  try { await post('/api/connect', { host, port }); saveServer(host, port); toast('Joining ' + host, true); } catch (err) { toast(err.message); }
};
busy('disconnect-btn', () => post('/api/disconnect'), 'Disconnected');
document.querySelectorAll('[data-dir]').forEach((b) => b.onclick = () => post('/api/move', { dir: b.dataset.dir }).catch((e) => toast(e.message)));
busy('look-btn', () => post('/api/move', { yaw: Number($('yaw').value) || 0, pitch: Number($('pitch').value) || 0 }), 'Looking');
$('chat-form').onsubmit = async (e) => { e.preventDefault(); const m = $('msg').value.trim(); if (!m) return; try { await post('/api/chat', { msg: m }); $('msg').value = ''; toast('Sent', true); } catch (err) { toast(err.message); } };

// ---- scripts ----
async function pollScripts() {
  let d; try { const r = await apiFetch('/api/scripts'); if (!r.ok) return; d = await r.json(); } catch { return; }
  $('scripts').innerHTML = d.scripts.map((s) => `<div class="script"><div class="t"><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></div><button class="tog ${s.active ? 'on' : ''}" data-s="${esc(s.name)}" data-on="${s.active ? 1 : 0}" ${s.installed ? '' : 'disabled title="Not installed"'} aria-label="${esc(s.title)}"></button></div>`).join('');
  $('scripts').querySelectorAll('.tog').forEach((b) => b.onclick = async () => {
    const on = b.dataset.on === '1'; b.disabled = true;
    try { await post('/api/script', { name: b.dataset.s, action: on ? 'stop' : 'start' }); toast(on ? 'Stopped, disconnecting' : 'Started, rejoining', true); } catch (e) { toast(e.message); }
    pollScripts();
  });
}

// ---- telemetry + logs ----
async function pollTelemetry() {
  try {
    const r = await apiFetch('/api/telemetry'); if (r.status === 401) return;
    if (!r.ok) throw 0;
    const d = await r.json();
    $('telemetry-placeholder').hidden = true; $('telemetry-data').hidden = false;
    for (const k of ['x', 'y', 'z', 'yaw', 'pitch', 'health']) { const v = d[k]; $('t-' + k).textContent = typeof v === 'number' ? (Math.round(v * 10) / 10).toString() : (v ?? '-'); }
    $('inv').innerHTML = (d.inventory || []).slice(0, 12).map((i) => `<div>${esc(i.name)}<b>${esc(i.count)}</b></div>`).join('');
  } catch { $('telemetry-data').hidden = true; $('telemetry-placeholder').hidden = false; }
}
let logs = {}, curLog = 'game';
function drawLog() { const v = logs[curLog]; const b = $('logbox'); b.textContent = v && v.length ? v : 'No logs yet'; b.scrollTop = b.scrollHeight; }
document.querySelectorAll('#logseg button').forEach((b) => b.onclick = () => { curLog = b.dataset.log; document.querySelectorAll('#logseg button').forEach((x) => x.classList.toggle('on', x === b)); drawLog(); });
async function pollLogs() { try { const r = await apiFetch('/api/logs?lines=120'); if (!r.ok) return; logs = await r.json(); drawLog(); } catch {} }

function startApp() {
  if (started) return; started = true;
  pollSession().then(pollStatus); pollScripts(); pollTelemetry(); pollLogs();
  setInterval(() => authed && pollSession().then(pollStatus), 4000);
  setInterval(() => authed && pollTelemetry(), 3000);
  setInterval(() => authed && pollLogs(), 5000);
  setInterval(() => authed && pollScripts(), 10000);
}
fetch('/api/auth-check').then((r) => r.json()).then((d) => { configured = d.configured !== false; if (!configured) { $('gate-btn').textContent = 'Set password'; $('gate-pw').placeholder = 'New password (12+ characters)'; $('gate-pw').autocomplete = 'new-password'; } d.authed ? hideGate() : showGate(); }).catch(showGate);
</script>
</body>
</html>
